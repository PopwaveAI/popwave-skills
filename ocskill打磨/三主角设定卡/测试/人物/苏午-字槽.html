<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>苏午 · 字槽混合式设定卡</title>
<style>
  :root{
    --cv-w:1125px;
    --cv-h:1500px;
    --slot-x:700px;
    --slot-y:520px;
    --slot-w:390px;
    --track-title-font:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    --track-body-font:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    --track-label-font:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    --ink:#eaf2f8;
    --muted:#9fb0c2;
    --em:#c0392b;
    --gold:#8a97a5;
    --seal-bg:#c0392b;
    --seal-fg:#f5f7fa;
    --divider:rgba(234,242,248,.3);
  }
  body[data-track="urban"]{
    --track-title-font:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    --track-body-font:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    --track-label-font:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    --ink:#eaf2f8;
    --muted:#9fb0c2;
    --em:#c0392b;
    --gold:#8a97a5;
    --seal-bg:#c0392b;
    --seal-fg:#f5f7fa;
    --divider:rgba(234,242,248,.3);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:var(--cv-w);height:var(--cv-h);overflow:hidden;}
  body{position:relative;font-family:var(--track-body-font);-webkit-font-smoothing:antialiased;}
  .base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .overlay{position:absolute;left:var(--slot-x);top:var(--slot-y);width:var(--slot-w);color:var(--ink);}
  .head{display:flex;align-items:center;gap:18px;margin-bottom:30px;}
  .head .leadseal{width:52px;height:52px;background:var(--seal-bg);color:var(--seal-fg);
    font-size:19px;font-weight:bold;display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 2px rgba(245,247,250,.5),0 2px 6px rgba(20,30,40,.2);flex:none;}
  .head .kicker{font-size:20px;color:var(--gold);letter-spacing:4px;border-bottom:1px solid var(--divider);padding-bottom:6px;}
  .creed{margin-bottom:8px;}
  .creed .q{font-size:50px;color:var(--ink);letter-spacing:3px;line-height:1.6;
    font-weight:bold;text-shadow:0 1px 0 rgba(255,255,255,.1);font-family:var(--track-title-font);}
  .creed .q em{font-style:normal;color:var(--em);}
  .creed .src{font-size:20px;color:var(--gold);margin-top:4px;letter-spacing:3px;text-align:right;padding-right:10px;}
  .divider{height:30px;margin:2px 0 4px;position:relative;}
  .divider::before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;
    background:linear-gradient(90deg,transparent,var(--divider),transparent);}
  .core{font-size:21px;color:var(--muted);line-height:1.9;letter-spacing:1px;margin-bottom:6px;}
  .core .k{color:var(--em);font-weight:bold;font-family:var(--track-title-font);}
  .divider.d2{height:26px;}
  .sym{margin-top:4px;}
  .sym .row{display:flex;align-items:baseline;margin-bottom:13px;}
  .sym .row:first-child{margin-left:0;}
  .sym .row:nth-child(2){margin-left:30px;}
  .sym .row:nth-child(3){margin-left:8px;}
  .sym .row:nth-child(4){margin-left:46px;}
  .sym .n{font-size:25px;color:var(--em);font-weight:bold;letter-spacing:2px;font-family:var(--track-label-font);flex:none;margin-right:14px;}
  .sym .d{font-size:19px;color:var(--muted);letter-spacing:1px;border-bottom:1px solid var(--divider);padding-bottom:3px;}
  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:30px;}
  .foot .name{font-size:26px;color:var(--ink);letter-spacing:5px;font-weight:bold;font-family:var(--track-title-font);}
  .foot .zhu{font-size:16px;color:var(--gold);letter-spacing:2px;}
  .foot .seal{width:72px;height:72px;background:var(--seal-bg);color:var(--seal-fg);
    font-size:21px;font-weight:bold;display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 2px rgba(245,247,250,.5),0 3px 8px rgba(20,30,40,.25);}
</style>
</head>
<body data-track="urban">
  <img class="base" src="苏午-v1.jpg" alt="苏午">
  <div class="overlay">
    <div class="head">
      <div class="leadseal">午</div>
      <div class="kicker">我的诡异人生 · 幸存者</div>
    </div>
    <div class="creed">
      <div class="q">「模拟重来，<em>换一条活路</em>。」</div>
      <div class="src">苏午</div>
    </div>
    <div class="divider"></div>
    <div class="core"><span class="k">人生模拟器：</span>都市诡异复苏，苏午以人生模拟器预演死亡——模拟中死即现实死，步步为营，在诡异浪潮中杀出一条活路。</div>
    <div class="divider d2"></div>
    <div class="sym">
      <div class="row"><span class="n">人生模拟器</span><span class="d">预知死亡·高压博弈</span></div>
      <div class="row"><span class="n">诡异复苏</span><span class="d">日常入侵·民俗恐怖</span></div>
      <div class="row"><span class="n">都市霓虹</span><span class="d">熟悉街道·陌生异化</span></div>
      <div class="row"><span class="n">幸存者</span><span class="d">如履薄冰·暗藏锋芒</span></div>
    </div>
    <div class="foot">
      <div class="name">苏午</div>
      <div class="zhu">我的诡异人生</div>
      <div class="seal">午</div>
    </div>
  </div>
</body>
</html>
