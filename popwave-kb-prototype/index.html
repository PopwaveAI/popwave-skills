<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>popwave 知识库 · 公域浏览原型</title>
<style>
:root{
  --bg:#f5f5fb;--bg2:#ffffff;--ink:#1b1d2b;--muted:#6a6e85;--rule:#e5e6f0;
  --accent:#5b5bd6;--accent2:#e86a92;
  --accent-soft:rgba(91,91,214,.10);--accent2-soft:rgba(232,106,146,.10);
  --shadow:0 10px 30px rgba(91,91,214,.08);--radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.7;font-size:15px;}
a{color:var(--accent);text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.app{display:flex;flex-direction:column;height:100vh;}
.appbar{display:flex;align-items:center;gap:16px;padding:12px 22px;background:var(--bg2);border-bottom:1px solid var(--rule);flex-shrink:0;}
.logo{font-weight:800;color:var(--accent);font-size:16px;display:flex;align-items:center;gap:8px;white-space:nowrap;}
.logo .sq{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--rule);border-radius:10px;padding:8px 14px;color:var(--muted);font-size:13px;}
.search input{flex:1;border:none;outline:none;font-size:13px;color:var(--ink);background:transparent;font-family:inherit;}
.search .kbd{font-size:10px;color:var(--muted);border:1px solid var(--rule);border-radius:4px;padding:1px 5px;}
.nav{display:flex;gap:6px;margin-left:auto;}
.nav .ni{font-size:13px;padding:7px 14px;border-radius:9px;color:var(--muted);font-weight:600;}
.nav .ni.on{background:var(--accent-soft);color:var(--accent);}
.nav .ni.cta{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
.body{display:flex;flex:1;overflow:hidden;}
.side{width:210px;flex-shrink:0;border-right:1px solid var(--rule);background:var(--bg2);padding:14px 12px;overflow-y:auto;}
.side .grp{font-size:10.5px;letter-spacing:.08em;color:var(--muted);margin:14px 6px 6px;font-weight:700;text-transform:uppercase;}
.side .it{font-size:13px;padding:8px 10px;border-radius:9px;color:var(--muted);margin:2px 0;display:flex;align-items:center;gap:9px;cursor:pointer;width:100%;text-align:left;}
.side .it:hover{background:var(--accent-soft);color:var(--accent);}
.side .it.on{background:var(--accent-soft);color:var(--accent);font-weight:700;}
.side .it .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.side .it .cnt{margin-left:auto;font-size:11px;color:var(--muted);}
.side .sub{padding-left:26px;font-size:12.5px;}
.main{flex:1;overflow-y:auto;padding:22px 26px;min-width:0;}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;}
.pill.pub{background:var(--accent-soft);color:var(--accent);}
.pill.per{background:var(--accent2-soft);color:var(--accent2);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.card{background:var(--bg2);border:1px solid var(--rule);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(91,91,214,.14);}
.card .t{font-size:14.5px;font-weight:700;margin:8px 0 4px;line-height:1.4;}
.card .s{font-size:12px;color:var(--muted);line-height:1.55;flex:1;}
.card .tags{margin-top:10px;display:flex;gap:5px;flex-wrap:wrap;}
.card .tags span{font-size:10px;background:#f0f0f6;color:var(--muted);padding:2px 7px;border-radius:6px;}
.card .foot{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--accent);}
.card .foot .v{margin-left:auto;color:var(--muted);}
.sec{font-size:12.5px;font-weight:800;color:var(--muted);letter-spacing:.06em;margin:20px 0 10px;display:flex;align-items:center;gap:8px;}
.sec .more{margin-left:auto;font-size:11px;color:var(--accent);font-weight:600;cursor:pointer;}
.stat{display:flex;gap:12px;margin-top:18px;}
.stat .st{flex:1;background:var(--bg2);border:1px solid var(--rule);border-radius:12px;padding:14px;text-align:center;}
.stat .st b{font-size:22px;color:var(--accent);display:block;}
.stat .st span{font-size:11px;color:var(--muted);}
.entry{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px;}
@media(max-width:720px){.entry{grid-template-columns:1fr;}}
.entry .ec{background:var(--bg2);border:1px solid var(--rule);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);cursor:pointer;}
.entry .ec.pub{border-top:4px solid var(--accent);}
.entry .ec.per{border-top:4px solid var(--accent2);}
.entry .ec h4{font-size:15px;font-weight:800;margin:8px 0 4px;}
.entry .ec.pub h4{color:var(--accent);}
.entry .ec.per h4{color:var(--accent2);}
.entry .ec p{font-size:12.5px;color:var(--muted);}
.entry .ec .go{margin-top:10px;font-size:12px;font-weight:700;color:var(--accent);}
.detail{display:flex;gap:0;min-height:100%;}
.detail .doc{flex:1;min-width:0;padding:6px 26px 40px 6px;}
.detail .doc .crumb{font-size:12px;color:var(--muted);margin-bottom:12px;}
.detail .doc .crumb a{color:var(--accent);cursor:pointer;}
.detail .doc h1{font-size:26px;font-weight:800;margin:6px 0 4px;line-height:1.3;}
.detail .doc .sub{font-size:12.5px;color:var(--muted);margin-bottom:18px;}
.detail .doc .files{margin:16px 0;}
.detail .doc .file{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--rule);border-radius:10px;margin-bottom:8px;background:var(--bg2);cursor:pointer;}
.detail .doc .file:hover{border-color:var(--accent);}
.detail .doc .file .ic{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0;}
.detail .doc .file .info b{font-size:13px;display:block;}
.detail .doc .file .info span{font-size:11px;color:var(--muted);}
.detail .doc .file .open{margin-left:auto;font-size:11px;color:var(--accent);}
.detail .meta{width:260px;flex-shrink:0;border-left:1px solid var(--rule);padding:18px;background:var(--bg2);overflow-y:auto;}
.detail .meta .mh{font-size:12px;font-weight:800;color:var(--muted);margin:0 0 8px;letter-spacing:.05em;}
.detail .meta .kv{font-size:12px;color:var(--muted);line-height:2;}
.detail .meta .kv b{color:var(--ink);}
.detail .meta .rel{font-size:12px;color:var(--accent);line-height:1.9;}
.detail .meta .acts{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
.btn{display:block;text-align:center;font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:10px;}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
.btn.ghost{background:#f0f0f6;color:var(--ink);}
.btn.line{background:transparent;border:1px solid var(--rule);color:var(--accent);}
.md{font-size:14px;line-height:1.85;color:var(--ink);}
.md h1{font-size:22px;font-weight:800;margin:22px 0 10px;}
.md h2{font-size:18px;font-weight:800;margin:20px 0 8px;border-bottom:1px solid var(--rule);padding-bottom:6px;}
.md h3{font-size:15.5px;font-weight:700;margin:16px 0 6px;}
.md p{margin:10px 0;}
.md ul,.md ol{margin:10px 0 10px 22px;}
.md li{margin:4px 0;}
.md blockquote{border-left:4px solid var(--accent2);background:var(--accent2-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0;color:var(--ink);}
.md blockquote p{margin:4px 0;}
.md strong{font-weight:700;}
.md table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0;}
.md th{background:var(--accent-soft);color:var(--accent);text-align:left;padding:8px 10px;font-weight:700;}
.md td{padding:8px 10px;border-top:1px solid var(--rule);}
.md code{background:#f0f0f6;padding:1px 5px;border-radius:4px;font-size:12.5px;}
.md hr{border:none;border-top:1px solid var(--rule);margin:16px 0;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;}
.empty .big{font-size:40px;margin-bottom:10px;}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.chip{font-size:12px;padding:5px 12px;border-radius:999px;background:var(--bg2);border:1px solid var(--rule);color:var(--muted);cursor:pointer;font-weight:600;}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
@media(max-width:820px){.side{display:none;}.detail .meta{display:none;}}
</style>
</head>
<body>
<div class="app">
  <div class="appbar">
    <div class="logo"><span class="sq"></span>popwave 知识库</div>
    <div class="search"><input id="q" placeholder="搜索技法 / 文风 / 设定包 / 拆书…" oninput="onSearch(this.value)"><span class="kbd">⌘K</span></div>
    <div class="nav">
      <span class="ni on" data-view="public" onclick="go('public')">公域</span>
      <span class="ni" data-view="mine" onclick="go('mine')">我的</span>
      <span class="ni cta" onclick="toast('原型阶段：新建入口占位')">＋ 新建</span>
    </div>
  </div>
  <div class="body">
    <aside class="side" id="side"></aside>
    <main class="main" id="main"><div class="empty"><div class="big">⏳</div>正在从 manifest 加载资产…</div></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ 库元信息（颜色/图标/描述，前端展示用） ============ */
const LIB_META = {
  "技法库": {icon:"技", color:"var(--accent)", desc:"团队沉淀的剧情模式 / 情境技法 / 通用技法 / 设计原则"},
  "文风库": {icon:"文", color:"var(--accent2)", desc:"按流派沉淀的笔触 DNA（句法 / 距离 / 感官 / 信息释放）"},
  "拆书库": {icon:"拆", color:"#2f9e6e", desc:"一本书一个文件夹，全量拆解归档"},
  "设定包库": {icon:"设", color:"#c07a2f", desc:"开盒即写的世界 / 驱动 / 笔法模板"},
  "知识库": {icon:"知", color:"#3a86c8", desc:"内部工作文档（技法 / 拆书 / 文风 / 视觉 / 调研 / 通用）"},
  "素材库": {icon:"素", color:"#8a8aa0", desc:"素材（预留）"}
};
const GENRES = ["西幻","修仙","仙侠","都市","末世","悬疑","游戏","规则","进化","民俗","非超自然","无限流","系统流","面板流","异能","玄幻","恐怖","情感","轻小说","家族仙侠","规则怪谈","医疗","DND","诸神流"];
const KBPREFIX = "../popwave知识库/";

/* ============ 运行时数据（由 manifest 构建） ============ */
let LIB = {};
let TRACKS = ["全部"];
let state = { view:"public", lib:null, cat:"全部", track:"全部", q:"", asset:null, file:null, ready:false };

/* ============ HELPERS ============ */
function allAssets(){ const a=[]; for(const k in LIB) LIB[k].assets.forEach(x=>a.push({...x,lib:k})); return a; }
function tagsOf(a){ const t=a.tags; if(Array.isArray(t)) return t; if(typeof t==="string" && t) return [t]; return []; }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
function catsOf(lib){ return [...new Set(LIB[lib].assets.map(a=>a.cat||"未分类"))]; }
function trackOf(a){ for(const t of TRACKS) if(t!=="全部" && tagsOf(a).includes(t)) return t; return null; }

/* ============ 初始化：fetch manifest 构建数据 ============ */
async function init(){
  try{
    const r = await fetch(KBPREFIX + "manifest.json");
    if(!r.ok) throw new Error("HTTP "+r.status);
    const data = await r.json();
    for(const libName in data.libraries){
      const meta = LIB_META[libName] || {icon:"?", color:"var(--accent)", desc:""};
      LIB[libName] = { ...meta, assets: data.libraries[libName].assets };
    }
    // 派生赛道：数据中真实出现的题材标签
    const tagSet = new Set();
    allAssets().forEach(a=>tagsOf(a).forEach(t=>{ if(GENRES.includes(t)) tagSet.add(t); }));
    TRACKS = ["全部", ...tagSet];
    state.ready = true;
    state.lib = Object.keys(LIB)[0] || "技法库";
    go("public", state.lib, "全部");
  }catch(e){
    document.getElementById("main").innerHTML =
      `<div class="empty"><div class="big">⚠️</div>无法加载 manifest.json<br>请通过 HTTP 服务访问（如 python -m http.server）<br><span style="font-size:12px">${esc(e.message)}</span></div>`;
  }
}

/* ============ ROUTER ============ */
function go(view, lib, cat, track, asset, file){
  if(!state.ready) return;
  state.view=view; if(lib) state.lib=lib; if(cat) state.cat=cat; if(track) state.track=track;
  state.asset=asset||null; state.file=file||null;
  document.querySelectorAll(".nav .ni").forEach(n=>n.classList.toggle("on", n.dataset.view===view));
  renderSide(); renderMain();
  document.getElementById("main").scrollTop=0; window.scrollTo(0,0);
}
function openAsset(lib, id){ go("public", lib, state.cat, state.track, id, null); }
function openFile(lib, id, f){ go("public", lib, state.cat, state.track, id, f); }

/* ============ SIDE ============ */
function renderSide(){
  const s=document.getElementById("side");
  if(state.view==="mine"){ s.innerHTML = mineSide(); return; }
  let h='<div class="grp">公域 · 库</div>';
  for(const k in LIB){
    const n=LIB[k].assets.length;
    h+=`<button class="it ${state.lib===k?'on':''}" onclick="go('public','${k}','全部')"><span class="dot" style="background:${LIB[k].color}"></span>${k}<span class="cnt">${n}</span></button>`;
    if(state.lib===k){
      h+=`<button class="it sub ${state.cat==='全部'?'on':''}" onclick="go('public','${k}','全部')">全部</button>`;
      catsOf(k).forEach(c=>{ h+=`<button class="it sub ${state.cat===c?'on':''}" onclick="go('public','${k}','${c}')">${c}</button>`; });
    }
  }
  s.innerHTML=h;
}
function mineSide(){
  const items=[["我的资产","var(--accent2)"],["我的收藏","var(--accent2)"],["我的草稿","var(--accent2)"],["我发布的","var(--accent2)"]];
  let h='<div class="grp">我的</div>';
  items.forEach(([t,c],i)=>h+=`<button class="it ${i===0?'on':''}"><span class="dot" style="background:${c}"></span>${t}</button>`);
  return h;
}

/* ============ MAIN ============ */
function renderMain(){
  const m=document.getElementById("main");
  if(state.view==="mine"){ m.innerHTML = mineView(); return; }
  if(state.asset) { renderDetail(m); return; }
  if(state.q){ m.innerHTML = searchView(); return; }
  m.innerHTML = browseView();
}

function homeView(){
  const feat=[ ["技法库","西幻诸神流剧情模式"], ["拆书库","深渊主宰-书单元"], ["文风库","深渊主宰-文风DNA"], ["设定包库","深渊主宰-官方设定包"] ];
  let cards="";
  feat.forEach(([lib,id])=>{ const a=LIB[lib]&&LIB[lib].assets.find(x=>x.id===id); if(a) cards+=cardHTML(a,lib); });
  return `
    <div class="entry">
      <div class="ec pub" onclick="go('public','${Object.keys(LIB)[0]}','全部')"><span class="pill pub">公域</span><h4>公域 · 策展资产库</h4><p>团队沉淀的规范资产，人人可用。技法 / 文风 / 设定包 / 拆书，版本化可追溯。</p><div class="go">进入公域 →</div></div>
      <div class="ec per" onclick="go('mine')"><span class="pill per">我的</span><h4>我的 · 私有工作台</h4><p>你的个人拆书、笔记、草稿、收藏。自由读写，可发布到公域。</p><div class="go">进入我的 →</div></div>
    </div>
    <div class="sec">公域精选 <span class="more" onclick="go('public','${Object.keys(LIB)[0]}','全部')">更多 →</span></div>
    <div class="grid">${cards||`<div class="empty">暂无精选</div>`}</div>
    <div class="stat">
      <div class="st"><b>${allAssets().length}</b><span>公域资产</span></div>
      <div class="st"><b>${Object.keys(LIB).length}</b><span>库</span></div>
      <div class="st"><b>${TRACKS.length-1}</b><span>题材标签</span></div>
      <div class="st"><b>0</b><span>我的资产</span></div>
    </div>`;
}

function browseView(){
  const lib=LIB[state.lib];
  let list=lib.assets;
  if(state.cat!=="全部") list=list.filter(a=>(a.cat||"未分类")===state.cat);
  if(state.track!=="全部") list=list.filter(a=>tagsOf(a).includes(state.track));
  const chips = TRACKS.map(t=>`<span class="chip ${state.track===t?'on':''}" onclick="go('public',state.lib,state.cat,'${t}')">${t}</span>`).join("");
  const body = list.length ? `<div class="grid">${list.map(a=>cardHTML(a,state.lib)).join("")}</div>`
    : `<div class="empty"><div class="big">🗂</div>该库下暂无「${state.cat==="全部"?"全部":state.cat}」${state.track!=="全部"?" · "+state.track:""}的资产</div>`;
  const title = state.cat==="全部" ? state.lib : `${state.lib} · ${state.cat}`;
  return `<div class="chips">${chips}</div><div class="sec">${title} <span style="margin-left:auto;font-size:11px;color:var(--muted)">${list.length} 项</span></div>${body}`;
}

function searchView(){
  const q=state.q.toLowerCase();
  const res=allAssets().filter(a=> (a.id+(a.cat||"")+a.lib+tagsOf(a).join("")).toLowerCase().includes(q));
  return `<div class="sec">搜索「${esc(state.q)}」 · ${res.length} 项</div>
    ${res.length?`<div class="grid">${res.map(a=>cardHTML(a,a.lib)).join("")}</div>`:`<div class="empty"><div class="big">🔍</div>没有匹配的资产</div>`}`;
}

function mineView(){
  const rows=[
    ["拆","新书 · 西幻立项草稿","个人笔记 · 编辑于 2 小时前","草稿","per"],
    ["文","我的文风偏好","个人文风DNA · 更新于昨天","私有","per"],
    ["拆","某书 · 个人拆书","个人拆书单元 · 已发布到公域","已发布","pub"]
  ];
  const tabs=["我的资产","收藏","草稿","已发布"];
  return `<div class="sec" style="margin-top:0">我的 · 私有工作台</div>
    <div class="chips">${tabs.map((t,i)=>`<span class="chip ${i===0?'on':''}">${t}</span>`).join("")}</div>
    ${rows.map(r=>`<div class="detail"><div class="doc" style="padding:0;flex:1"><div class="file" style="cursor:default"><div class="ic" style="background:${r[4]==='pub'?'var(--accent-soft)':'var(--accent2-soft)'};color:${r[4]==='pub'?'var(--accent)':'var(--accent2)'}">${r[0]}</div><div class="info"><b>${r[1]}</b><span>${r[2]}</span></div><span class="pill ${r[4]==='pub'?'pub':'per'}" style="margin-left:auto">${r[3]}</span></div></div></div>`).join("")}
    <div class="empty" style="padding:30px">原型阶段：个人空间为占位展示，后续 Phase 3 实现完整读写。</div>`;
}

function cardHTML(a,lib){
  const isBundle=a.bundle&&a.bundle.length;
  const cat=a.cat||"未分类";
  return `<div class="card" onclick="openAsset('${lib}','${a.id}')">
    <span class="pill pub">${lib.replace("库","")}</span>
    <div class="t">${esc(a.id)}</div>
    <div class="s">${esc(a.desc||"（暂无摘要）")}</div>
    <div class="tags">${tagsOf(a).slice(0,4).map(t=>`<span>${esc(t)}</span>`).join("")}</div>
    <div class="foot">${cat}${isBundle?` · ${a.bundle.length} 文件`:" · 单文件"}<span class="v">v${a.version||"1.0.0"}</span></div>
  </div>`;
}

function renderDetail(m){
  const a=LIB[state.lib].assets.find(x=>x.id===state.asset);
  if(!a){ m.innerHTML=`<div class="empty">资产不存在</div>`; return; }
  const related=relatedAssets(a);
  let doc;
  if(a.bundle&&a.bundle.length){
    const files=a.bundle.map(f=>`
      <div class="file" onclick="openFile('${state.lib}','${a.id}','${f}')">
        <div class="ic">${f.slice(0,2)}</div>
        <div class="info"><b>${esc(f)}</b></div>
        <span class="open">查看 →</span>
      </div>`).join("");
    doc=`<div class="crumb"><a onclick="go('public','${state.lib}','全部')">${state.lib}</a> / ${esc(a.cat||"未分类")} / ${esc(a.id)}</div>
      <span class="pill pub">${state.lib.replace("库","")}单元</span>
      <h1>${esc(a.id)}</h1>
      <div class="sub">${esc(a.desc||"")}</div>
      <div class="sec" style="margin-top:6px">文件清单</div>
      <div class="files">${files}</div>`;
  } else {
    doc=`<div class="crumb"><a onclick="go('public','${state.lib}','全部')">${state.lib}</a> / ${esc(a.cat||"未分类")} / ${esc(a.id)}</div>
      <span class="pill pub">${state.lib.replace("库","")}</span>
      <h1>${esc(a.id)}</h1>
      <div class="sub">${esc(a.desc||"")}</div>
      <div class="sec" style="margin-top:6px">内容预览</div>
      <div class="md" id="md">加载中…</div>`;
    loadMd(a.path, null);
  }
  const meta=`
    <div class="mh">元数据</div>
    <div class="kv">库：<b>${state.lib}</b><br>子分类：<b>${a.cat||"未分类"}</b><br>版本：<b>v${a.version||"1.0.0"}</b><br>来源：popwave 团队策展<br>标签：${tagsOf(a).join(" / ")||"—"}</div>
    <div class="mh" style="margin-top:16px">关联资产</div>
    <div class="rel">${related.length?related.map(r=>`<div style="cursor:pointer" onclick="openAsset('${r.lib}','${r.id}')">${esc(r.id)}</div>`).join(""):"暂无关联"}</div>
    <div class="acts">
      <button class="btn pri" onclick="toast('已引用到「我的」')">引用到我的</button>
      <button class="btn ghost" onclick="toast('已收藏')">收藏</button>
      <button class="btn line" onclick="toast('已复制到个人空间')">复制</button>
    </div>`;
  m.innerHTML=`<div class="detail"><div class="doc">${doc}</div><div class="meta">${meta}</div></div>`;
}
function relatedAssets(a){
  const key=trackOf(a)||a.cat||"";
  return allAssets().filter(x=>x.id!==a.id && (tagsOf(x).includes(key)||(x.cat||"")===key)).slice(0,3);
}

/* ============ MARKDOWN LOAD ============ */
async function loadMd(path, file){
  const el=document.getElementById("md"); if(!el) return;
  const url = KBPREFIX + (file ? path + "/" + file : path);
  try{
    const r=await fetch(url);
    if(!r.ok) throw 0;
    const txt=await r.text();
    el.innerHTML=renderMd(txt);
  }catch(e){
    el.innerHTML=`<div class="empty" style="padding:20px"><div class="big">⚠️</div>无法读取文件：${esc(url)}</div>`;
  }
}
function renderMd(t){
  let lines=t.split(/\r?\n/); let out=""; let inList=null; let inTable=false;
  const flush=()=>{ if(inList){ out+=`</${inList}>`; inList=null; } };
  for(const raw of lines){
    const l=raw.trim();
    if(!l){ flush(); continue; }
    if(/^```/.test(l)){ flush(); out+=`<pre><code>${esc(raw.replace(/^```.*/,""))}</code></pre>`; continue; }
    if(/^#{1,3}\s/.test(l)){ flush(); const n=l.match(/^(#{1,3})\s(.*)/); const h=n[1].length; out+=`<h${h}>${inline(n[2])}</h${h}>`; continue; }
    if(/^\|/.test(l)){ if(!inTable){ inTable=true; out+="<table>"; } if(/^[\s|:-]+$/.test(l.replace(/\|/g,"").trim())) continue; const cells=l.replace(/^\||\|$/g,"").split("|").map(c=>`<td>${inline(c.trim())}</td>`).join(""); out+=`<tr>${cells}</tr>`; continue; }
    if(inTable){ inTable=false; out+="</table>"; }
    if(/^>\s?/.test(l)){ flush(); out+=`<blockquote>${inline(l.replace(/^>\s?/,""))}</blockquote>`; continue; }
    if(/^[-*]\s/.test(l)){ if(inList!=="ul"){ flush(); inList="ul"; out+="<ul>"; } out+=`<li>${inline(l.replace(/^[-*]\s/,""))}</li>`; continue; }
    if(/^\d+\.\s/.test(l)){ if(inList!=="ol"){ flush(); inList="ol"; out+="<ol>"; } out+=`<li>${inline(l.replace(/^\d+\.\s/,""))}</li>`; continue; }
    flush(); out+=`<p>${inline(l)}</p>`;
  }
  flush(); if(inTable) out+="</table>";
  return out;
}
function inline(s){
  return esc(s)
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\[([^\]]+)\]\([^)]+\)/g,"$1");
}

/* ============ SEARCH ============ */
function onSearch(v){ state.q=v.trim(); state.asset=null; if(state.ready) renderMain(); }

/* ============ INIT ============ */
document.addEventListener("keydown",e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); document.getElementById("q").focus(); } });
init();
</script>
