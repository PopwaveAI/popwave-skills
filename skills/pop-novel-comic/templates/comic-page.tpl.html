<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} · 漫画版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #1a1a1a;
    font-family: "Noto Sans CJK SC", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px;
  }

  .comic-page {
    width: 100%;
    max-width: 900px;
    background: #f5f0e8;
    padding: 24px;
    border-radius: 4px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.5);
  }

  .comic-title {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    color: #2a1a0a;
    margin-bottom: 4px;
    letter-spacing: 4px;
  }

  .comic-subtitle {
    text-align: center;
    font-size: 12px;
    color: #8a7a6a;
    margin-bottom: 20px;
    letter-spacing: 2px;
  }

  .panel {
    position: relative;
    overflow: hidden;
    border: 3px solid #1a1a1a;
    background: #000;
  }

  .panel img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .grid {
    display: grid;
    gap: 8px;
    grid-template-columns: 1fr 1fr;
  }

  .panel-full { grid-column: 1 / -1; }
  .panel-half { aspect-ratio: 3 / 4; }
  .panel-full { aspect-ratio: 7 / 4; }

  .panel-num {
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 10px;
    color: rgba(255,255,255,0.5);
    z-index: 5;
  }

  .bubble {
    position: absolute;
    background: #fff;
    border: 2px solid #1a1a1a;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    color: #1a1a1a;
    max-width: 55%;
    line-height: 1.5;
    z-index: 10;
    box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }

  .bubble::after {
    content: '';
    position: absolute;
    width: 0; height: 0;
    border: 8px solid transparent;
  }

  .narration {
    position: absolute;
    background: rgba(245,230,200,0.92);
    border: 1.5px solid #5a3a1a;
    padding: 4px 10px;
    font-size: 11px;
    color: #3a2a0a;
    z-index: 10;
    box-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    max-width: 30%;
    border-radius: 2px;
  }

  .sfx {
    position: absolute;
    font-weight: 900;
    font-style: italic;
    color: #fff;
    text-shadow: 2px 2px 0 #1a1a1a, -1px -1px 0 #1a1a1a, 1px -1px 0 #1a1a1a, -1px 1px 0 #1a1a1a;
    z-index: 10;
    letter-spacing: 2px;
    transform: rotate(-5deg);
  }

  .separator {
    text-align: center;
    margin: 16px 0 8px;
    color: #aaa;
    font-size: 11px;
    letter-spacing: 6px;
  }

  .comic-footer {
    text-align: center;
    margin-top: 20px;
    font-size: 11px;
    color: #aaa;
    letter-spacing: 1px;
  }

  /* === 气泡位置类（按需调整） === */
  /* 对话气泡 */
  .bubble-tl { top: 12%; left: 8%; }
  .bubble-tl::after { border-top-color: #fff; bottom: -14px; left: 20px; border-bottom: 0; }
  .bubble-tr { top: 10%; right: 8%; }
  .bubble-tr::after { border-top-color: #fff; bottom: -14px; right: 20px; border-bottom: 0; }
  .bubble-bl { bottom: 12%; left: 8%; }
  .bubble-bl::after { border-bottom-color: #fff; top: -14px; left: 20px; border-top: 0; }
  .bubble-br { bottom: 15%; right: 8%; }
  .bubble-br::after { border-bottom-color: #fff; top: -14px; right: 20px; border-top: 0; }
  .bubble-tc { top: 12%; left: 50%; transform: translateX(-50%); max-width: 65%; }
  .bubble-tc::after { border-bottom-color: #fff; top: -14px; left: 50%; margin-left: -8px; border-top: 0; }
  .bubble-bc { bottom: 12%; left: 50%; transform: translateX(-50%); }
  .bubble-bc::after { border-top-color: #fff; bottom: -14px; left: 50%; margin-left: -8px; border-bottom: 0; }

  /* 旁白框 */
  .narration-tr { top: 6%; right: 6%; }
  .narration-tl { top: 6%; left: 6%; }
  .narration-br { bottom: 6%; right: 6%; }
  .narration-bl { bottom: 6%; left: 6%; }

  /* 拟声词 */
  .sfx-tl { top: 35%; left: 15%; font-size: 28px; color: #ff4444; }
  .sfx-br { bottom: 10%; right: 12%; font-size: 24px; }
  .sfx-bl { bottom: 10%; left: 8%; font-size: 12px; color: #ffaa44; text-shadow: 1px 1px 2px #000; }

  /* 特效文字 */
  .effect-text {
    position: absolute;
    top: 15%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 16px;
    font-weight: 700;
    color: #ffd700;
    text-shadow: 0 0 10px rgba(255,215,0,0.5), 1px 1px 2px #000;
    z-index: 10;
    letter-spacing: 3px;
  }
</style>
</head>
<body>
<div class="comic-page">
  <div class="comic-title">{{TITLE}}</div>
  <div class="comic-subtitle">{{SUBTITLE}}</div>

  <div class="grid">
    <!-- Frame 1: 全宽 -->
    <div class="panel panel-full">
      <img src="output/frame1.png" alt="frame1">
      <span class="panel-num">1</span>
      <!-- {{FRAME_1_OVERLAY}} -->
    </div>

    <!-- Frame 2: 半宽 -->
    <div class="panel panel-half">
      <img src="output/frame2.png" alt="frame2">
      <span class="panel-num">2</span>
      <!-- {{FRAME_2_OVERLAY}} -->
    </div>

    <!-- Frame 3: 半宽 -->
    <div class="panel panel-half">
      <img src="output/frame3.png" alt="frame3">
      <span class="panel-num">3</span>
      <!-- {{FRAME_3_OVERLAY}} -->
    </div>

    <!-- Frame 4: 全宽 -->
    <div class="panel panel-full">
      <img src="output/frame4.png" alt="frame4">
      <span class="panel-num">4</span>
      <!-- {{FRAME_4_OVERLAY}} -->
    </div>

    <!-- Frame 5: 半宽 -->
    <div class="panel panel-half">
      <img src="output/frame5.png" alt="frame5">
      <span class="panel-num">5</span>
      <!-- {{FRAME_5_OVERLAY}} -->
    </div>

    <!-- Frame 6: 半宽 -->
    <div class="panel panel-half">
      <img src="output/frame6.png" alt="frame6">
      <span class="panel-num">6</span>
      <!-- {{FRAME_6_OVERLAY}} -->
    </div>

    <!-- Frame 7: 全宽 -->
    <div class="panel panel-full">
      <img src="output/frame7.png" alt="frame7">
      <span class="panel-num">7</span>
      <!-- {{FRAME_7_OVERLAY}} -->
    </div>

    <!-- Frame 8: 全宽 -->
    <div class="panel panel-full">
      <img src="output/frame8.png" alt="frame8">
      <span class="panel-num">8</span>
      <!-- {{FRAME_8_OVERLAY}} -->
    </div>
  </div>

  <div class="separator">— 待 续 —</div>
  <div class="comic-footer">{{TITLE}} · {{SUBTITLE}} · Seedream 生成</div>
</div>
</body>
</html>
