<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{entity_name}} · {{type}}设定卡</title>
<style>
:root{
  --gold:{{accent}};
  --gold2:{{accent2}};
  --ink:#F2F2F5;
  --muted:#B9BFCD;
  --dim:#7E8496;
  --line:{{accent_line}};
  --line-soft:{{accent_line_soft}};
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
  background:#06070C;color:var(--ink);font-size:14px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;padding:44px 16px;
}
.wrap{width:100%;max-width:640px;margin:0 auto}

.frame{
  background:
    radial-gradient(700px 340px at 80% -10%, {{accent_glow}}, transparent 60%),
    radial-gradient(520px 300px at 5% 108%, {{accent2_glow}}, transparent 60%),
    linear-gradient(180deg,#0E1018,#0A0C12);
  border:1px solid var(--line-soft);border-radius:22px;
  padding:34px;position:relative;
}
.frame::before{content:'';position:absolute;inset:10px;border:1px solid var(--line-soft);border-radius:15px;pointer-events:none}
.corner{position:absolute;width:26px;height:26px;border:2px solid var(--line);opacity:.7}
.corner.tl{top:16px;left:16px;border-right:none;border-bottom:none;border-top-left-radius:9px}
.corner.tr{top:16px;right:16px;border-left:none;border-bottom:none;border-top-right-radius:9px}
.corner.bl{bottom:16px;left:16px;border-right:none;border-top:none;border-bottom-left-radius:9px}
.corner.br{bottom:16px;right:16px;border-left:none;border-top:none;border-bottom-right-radius:9px}

/* ===== 顶部标题区 ===== */
.head{text-align:center;padding:6px 0 22px;position:relative;z-index:1}
.head .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.series-tag{font-size:10.5px;letter-spacing:2px;color:var(--gold);border:1px solid var(--line);padding:4px 12px;border-radius:20px}
.type-tag{font-size:10.5px;font-weight:800;letter-spacing:.5px;background:linear-gradient(135deg,var(--gold),{{accent3}});color:{{tag_fg}};padding:4px 12px;border-radius:5px}
.entity-name{font-size:46px;font-weight:900;letter-spacing:.12em;line-height:1.05;
  background:linear-gradient(120deg,{{grad_c1}},{{accent}} 48%,{{grad_c3}});
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 20px {{accent_glow}})}
.positioning{margin-top:10px;font-size:13px;letter-spacing:.4em;color:var(--gold2);font-weight:600}
.rule-line{width:80px;height:1px;margin:14px auto 0;background:linear-gradient(to right,transparent,var(--gold),transparent)}

/* ===== 主视觉图：独立画框，图是主角 ===== */
.main-figure{position:relative;z-index:1;border-radius:14px;overflow:hidden;margin:0;
  border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.6)}
.main-figure img{display:block;width:100%;height:auto;object-fit:cover}
.main-figure::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(to right,transparent,var(--gold),transparent)}
.main-cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:18px 16px 14px;
  background:linear-gradient(to top,rgba(6,7,12,.92),transparent);
  font-size:12px;letter-spacing:.3em;color:var(--gold);font-weight:700}

/* ===== 多表达图格区：多视角/多状态/日常 Reference Sheet ===== */
/* 三种版式由 {{variant_type}} 切换：state=多状态 / view=多视角 / daily=日常向 */
.variants{display:grid;gap:12px;margin-top:12px;position:relative;z-index:1}
.variant{position:relative;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.10);
  background:rgba(14,16,24,.6);transition:.18s}
.variant:hover{border-color:var(--line);transform:translateY(-2px)}
.variant img{display:block;width:100%;height:auto;object-fit:cover;aspect-ratio:{{variant_ratio}}}
.variant .lbl{position:absolute;left:0;right:0;bottom:0;padding:14px 10px 9px;font-size:10.5px;letter-spacing:.2em;color:var(--ink);font-weight:700;
  background:linear-gradient(to top,rgba(6,7,12,.9),transparent)}
.variant .idx{position:absolute;top:8px;left:8px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;color:{{tag_fg}};background:linear-gradient(135deg,var(--gold),{{accent3}})}
.variant .stat{position:absolute;top:0;right:0;padding:4px 9px;font-size:9.5px;letter-spacing:.15em;font-weight:800;
  background:rgba(6,7,12,.72);color:var(--gold);border-bottom-left-radius:9px}

/* 多状态 state：2 列竖图（3:4），反差张力 */
.variants.state{grid-template-columns:repeat(2,1fr)}
/* 多视角 view：3-4 列方图（1:1），专业参考感 */
.variants.view{grid-template-columns:repeat(4,1fr)}
/* 日常向 daily：2-3 列横图（4:3），生活切片 */
.variants.daily{grid-template-columns:repeat(3,1fr)}

/* ===== 底部信息区 ===== */
.info{position:relative;z-index:1;padding:24px 8px 0;display:flex;flex-direction:column;gap:20px}
.creed{text-align:center}
.creed .q{font-size:17px;letter-spacing:.15em;color:{{creed_color}};font-weight:700;line-height:1.9;text-shadow:0 2px 14px {{accent_glow}}}
.creed .src{margin-top:6px;font-size:10.5px;color:var(--dim);letter-spacing:.25em}
.divide{height:1px;background:linear-gradient(to right,transparent,rgba(232,190,108,.35),transparent)}

.title-tag{display:flex;justify-content:center}
.title-tag span{font-size:15px;font-weight:800;letter-spacing:.35em;color:var(--gold);border:1px solid var(--line);
  padding:6px 18px;border-radius:6px;background:rgba(14,16,24,.5)}

.attrs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.attr{display:flex;align-items:center;gap:6px;font-size:11.5px;border:1px solid rgba(255,255,255,.10);
  padding:5px 12px;border-radius:20px;background:rgba(14,16,24,.5)}
.attr b{color:var(--gold);font-weight:800;letter-spacing:.1em}
.attr span{color:var(--muted)}

.core{display:flex;gap:14px;align-items:flex-start}
.core .tag{flex-shrink:0;font-size:10.5px;font-weight:800;color:var(--gold);letter-spacing:.2em;border:1px solid var(--line);padding:3px 9px;border-radius:5px;margin-top:3px}
.core p{font-size:13px;line-height:1.9;color:var(--muted);letter-spacing:.03em}
.core p b{color:var(--gold);font-weight:700}

.palette{display:flex;gap:10px;justify-content:center}
.palette .sw{width:52px;text-align:center}
.palette .c{width:52px;height:52px;border-radius:10px;border:1px solid rgba(255,255,255,.16);position:relative;box-shadow:inset 0 -8px 14px rgba(0,0,0,.3)}
.palette .c::after{content:'';position:absolute;top:0;left:0;right:0;height:42%;background:rgba(255,255,255,.2);border-radius:10px 10px 2px 2px}
.palette .n{font-size:10px;color:var(--dim);letter-spacing:.08em;margin-top:5px}

.poem{text-align:center}
.poem .p{font-size:14px;letter-spacing:.22em;color:var(--gold2);font-weight:700;line-height:2}
.poem .s{font-size:10.5px;color:var(--dim);letter-spacing:.2em;margin-top:4px}

.quote{display:flex;gap:14px;align-items:flex-start}
.quote .tag{flex-shrink:0;font-size:10.5px;font-weight:800;color:var(--gold);letter-spacing:.2em;border:1px solid var(--line);padding:3px 9px;border-radius:5px;margin-top:3px}
.quote p{font-size:13px;line-height:1.9;color:var(--muted);letter-spacing:.05em}
.quote p b{color:var(--gold)}

.bio{border-top:1px solid rgba(255,255,255,.08);padding-top:18px}
.bio h4{font-size:11px;letter-spacing:.3em;color:var(--gold);margin-bottom:8px;font-weight:800}
.bio p{font-size:13px;line-height:2;color:var(--muted);letter-spacing:.04em;text-align:justify}
.bio p b{color:var(--gold)}

.brand{display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;letter-spacing:.2em;color:rgba(185,191,205,.55);padding-top:4px;margin-top:2px}
.brand b{font-weight:800;background:linear-gradient(120deg,#F5ECD8,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.main-figure{animation:fadeUp .7s ease both}
.variants{animation:fadeUp .9s .1s ease both}
.info{animation:fadeUp 1s .2s ease both}

@media(max-width:520px){
  body{padding:20px 9px}
  .frame{padding:22px}
  .frame::before{inset:7px}
  .entity-name{font-size:34px}
  .variants.state,.variants.daily{grid-template-columns:1fr 1fr}
  .variants.view{grid-template-columns:repeat(2,1fr)}
  .info{padding:18px 2px 0}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="frame">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>

    <!-- 顶部标题区 -->
    <div class="head">
      <div class="topbar">
        <span class="series-tag">{{series_name}}</span>
        <span class="type-tag">{{type}}设定卡</span>
      </div>
      <div class="entity-name">{{entity_name}}</div>
      <div class="positioning">{{positioning}}</div>
      <div class="rule-line"></div>
    </div>

    <!-- 主视觉图：独立画框 -->
    <figure class="main-figure">
      <img src="{{main_visual_src}}" alt="{{entity_name}}主视觉">
      <div class="main-cap">{{main_caption}}</div>
    </figure>

    <!-- 多表达图格：多视角/多状态/日常 Reference Sheet
         版式由 class 切换：state / view / daily
         每项一个图格，替换整块：
      <div class="variant"><span class="idx">{{n}}</span><span class="stat">{{stat}}</span><img src="{{src}}" alt="{{lbl}}"><span class="lbl">{{lbl}}</span></div>
    -->
    <div class="variants {{variant_type}}">
      {{variant_items}}
    </div>

    <!-- 底部信息区 -->
    <div class="info">
      <div class="creed"><div class="q">{{creed}}</div><div class="src">{{creed_src}}</div></div>

      <div class="divide"></div>

      <div class="title-tag"><span>{{title_text}}</span></div>

      <div class="attrs">
        <!-- 示例：<div class="attr"><b>境界</b><span>辟谷</span></div> -->
        {{attr_items}}
      </div>

      <div class="core"><span class="tag">{{core_tag}}</span><p>{{core_text}}</p></div>

      <div class="palette">
        <!-- 示例：<div class="sw"><div class="c" style="background:#8E2F2A"></div><div class="n">朱砂红</div></div> -->
        {{palette_items}}
      </div>

      <div class="poem"><div class="p">{{poem}}</div><div class="s">{{poem_src}}</div></div>

      <div class="quote"><span class="tag">{{quote_tag}}</span><p>{{quote_text}}</p></div>

      <div class="bio"><h4>{{bio_title}}</h4><p>{{bio_text}}</p></div>

      <div class="brand">popwave.cn <b>让创意一键落地</b></div>
    </div>
  </div>
</div>
</body>
</html>
