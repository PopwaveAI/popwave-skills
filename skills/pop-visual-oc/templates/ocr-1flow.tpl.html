<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{name}} · OC 顶部聚字卡</title>
<style>
/* =====================================================================
   ocr-1flow.tpl.html · OC 唯一模板（立绘优先 · 顶部聚字 · V6）
   ---------------------------------------------------------------------
   范式：AI 底图只出【纯立绘零文字】（G1），占画面≥60%，人物居中下部、
        顶部留≥40%纯净背景。HTML 只在【顶部纯背景区】叠少量核心文字
        （类型/名字/称号/一句金句，G2），底部留一个小印章。整图截图即成品。
   四律：G1 AI 零文字 / G2 文字顶部聚 / G3 字不压人物 / G4 字少而精
   用法：改 {{变量}} + :root 变量（字色/印章/画布），截图即成品。
   截图：SCREENSHOT_WIDTH=1125 SCREENSHOT_SCALE=2 python scripts/screenshot_album.py <html> <out.png>
   ===================================================================== */
:root{
  --cv-w:1125px;            /* 画布宽（对应底图比例） */
  --cv-h:1500px;            /* 画布高 */
  /* 顶部文字字色：从底图顶部留白区实际取色微调（浅底用深墨，深底用浅金） */
  --ink:#241a12;            /* 名字/主字 */
  --em:#8a1f1f;             /* 强调字（称号关键词/金句点睛） */
  --gold:#6a4a20;           /* 类型标签/印章点缀 */
  --muted:#4a3a28;          /* 副标题弱化 */
  /* 顶部文字区（顶部聚字，人物头顶下方留装修） */
  --pad-top:60px;
  --em-size:60px;           /* 名字字号 */
  --sub-size:22px;          /* 称号字号 */
  --kicker-size:17px;       /* 类型标签字号 */
  --creed-size:26px;        /* 金句字号 */
  /* 底部印章（避开人物下摆） */
  --seal-size:64px;
  --seal-color:#8a1f1f;
  --seal-x:auto;            /* auto=靠右；可设 left/right + 偏移 */
  --seal-align:right;
  --seal-offset:56px;
  --seal-bottom:48px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:var(--cv-w);height:var(--cv-h);overflow:hidden;}
body{
  position:relative;
  font-family:"Kaiti SC","STKaiti","KaiTi","Noto Serif CJK SC",serif;
  -webkit-font-smoothing:antialiased;
  background:#000;
}
/* AI 底图：纯立绘零文字，占满画布 */
.base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}

/* ===== 顶部聚字区（文字只落顶部纯背景，不压人物） ===== */
.top{
  position:absolute;top:var(--pad-top);left:0;right:0;
  text-align:center;z-index:2;
  padding:0 48px;
}
.top .kicker{
  font-size:var(--kicker-size);letter-spacing:.5em;color:var(--gold);
  margin-bottom:18px;font-weight:600;
}
.top h1{
  font-size:var(--em-size);color:var(--ink);font-weight:bold;
  letter-spacing:.18em;line-height:1.15;
  text-shadow:0 2px 6px rgba(255,255,255,.35);
}
.top .rule{
  width:120px;height:1px;margin:18px auto 0;
  background:linear-gradient(to right,transparent,var(--gold),transparent);
}
.top .sub{
  margin-top:16px;font-size:var(--sub-size);color:var(--em);
  letter-spacing:.3em;font-weight:600;
}
/* 金句（可选，钩子） */
.top .creed{
  margin-top:20px;font-size:var(--creed-size);color:var(--muted);
  letter-spacing:.12em;line-height:1.6;
  font-family:"FangSong","STFangsong","仿宋",serif;
}
.top .creed b{color:var(--em);font-weight:600;}

/* ===== 底部印章（一个，避开人物下摆） ===== */
.sealpos{
  position:absolute;bottom:var(--seal-bottom);z-index:2;
  text-align:center;
  left:auto;right:var(--seal-offset);
}
.sealpos[data-align="left"]{left:var(--seal-offset);right:auto;}
.seal{
  width:var(--seal-size);height:var(--seal-size);
  border:2px solid var(--seal-color);color:var(--seal-color);
  background:rgba(255,255,255,.25);
  font-size:20px;font-weight:bold;letter-spacing:.12em;
  display:flex;align-items:center;justify-content:center;
  transform:rotate(-3deg);
  box-shadow:inset 0 0 0 3px rgba(138,31,31,.12),0 3px 8px rgba(0,0,0,.18);
}
.sealpos .cap{
  margin-top:8px;font-size:12px;letter-spacing:.3em;color:var(--muted);
}
</style>
</head>
<body>
  <!-- AI 底图：纯立绘零文字，占满画布 -->
  <img class="base" src="{{visual_path}}" alt="{{name}}">

  <!-- 顶部聚字区（文字只落顶部纯背景） -->
  <div class="top">
    <div class="kicker">{{kicker}}</div>
    <h1>{{name}}</h1>
    <div class="rule"></div>
    <div class="sub">{{subtitle}}</div>
    <!-- 金句（可选，钩子；无则不填整个块） -->
    <div class="creed">{{creed}}</div>
  </div>

  <!-- 底部印章（一个专属印章，印文≤4字） -->
  <div class="sealpos" data-align="{{seal_align}}">
    <div class="seal">{{seal}}</div>
    <div class="cap">{{seal_cap}}</div>
  </div>
</body>
</html>
